global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  traefik:
    address: ":8081"  # Use port 8081 instead. Because in this session Jenkins is on port 8080

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: fozouni@hotmail.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web
      
api:
  dashboard: true
  insecure: false 

log:
  level: INFO

accessLog: {}
# accessLog:
#   filePath: /var/log/traefik/access.log