# 02-kafka-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka # 🔴 statefulset gives us kafka-0 based on this name. If replicas is set to 3 we have kafka-0, kafka-1, kafka-2
  namespace: kafka-yaml
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              export KAFKA_NODE_ID=$(hostname | awk -F'-' '{print $NF}')
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://$(hostname).kafka-headless.kafka-yaml.svc.cluster.local:9092,EXTERNAL://localhost:30092"
              exec /etc/kafka/docker/run
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 9093
              name: controller
            - containerPort: 30092
              name: external
          env:
            - name: CLUSTER_ID
              value: "adRzRJnkRcmycsHcDzZjQA"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.kafka-yaml.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:30092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LOG_DIRS #🔴 log.dirs ===> turns into "KAFKA_LOG_DIRS"  
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          resources:
            requests:
              cpu: "300m"            # 300 millicores = 0.3 of one CPU core (reserved)
              memory: "768Mi"        # 768 MiB of RAM reserved for this container
            limits:
              cpu: "750m"            # max 0.75 CPU core — throttled if exceeded
              memory: "1.5Gi"        # max 1.5 GiB RAM — OOMKilled (Out Of Memory Killed) if exceeded
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data   # Kafka writes its logs/data here
          readinessProbe:
            tcpSocket:
              port: 9092              # probe succeeds if a TCP connection to 9092 works
            initialDelaySeconds: 15   # wait 15s after container start before first probe
            periodSeconds: 10         # probe every 10 seconds thereafter
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"] # Mounted read-write by one node at a time (typical for Kafka).
        storageClassName: standard     # Which StorageClass provisions the volume ("standard" = Minikube default).
        resources:
          requests:
            storage: 2Gi               # Size of the volume to allocate (can grow later).

########################################################
# StatefulSet
# ├── metadata
# ├── spec                    <=== 1️⃣ StatefulSet spec
# │   ├── serviceName
# │   ├── replicas
# │   ├── selector
# │   ├── template
# │   │   ├── metadata
# │   │   └── spec            <=== 2️⃣ Pod spec
# │   │       ├── containers
# │   │       └── volumeMounts
# │   └── volumeClaimTemplates
# │       └── [0]
# │           ├── metadata
# │           └── spec        <=== 3️⃣ PVC spec [PersistentVolumeClaims (PVCs)] 
########################################################